<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="500" height="500" fill="url(#bgGradient)"/>

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2D31" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A1D20" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="glowGradient">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Central icon container -->
  <g transform="translate(250, 250)">
    <!-- Circular background glow -->
    <circle cx="0" cy="0" r="100" fill="url(#glowGradient)" opacity="0.3"/>

    <!-- Modern image icon -->
    <g transform="translate(-60, -60)">
      <!-- Picture frame -->
      <rect x="0" y="0" width="120" height="120" rx="12" stroke="#6B7280" stroke-width="2.5" fill="none" opacity="0.6"/>

      <!-- Stylized mountain/landscape -->
      <path d="M15 90 L40 60 L65 75 L90 50 L105 75 L105 105 L15 105 Z" fill="#6B7280" opacity="0.3"/>

      <!-- Sun/circle element -->
      <circle cx="85" cy="35" r="12" fill="#6B7280" opacity="0.25"/>

      <!-- Modern camera icon in bottom right -->
      <g transform="translate(72, 75)" opacity="0.5">
        <!-- Camera body -->
        <rect x="0" y="6" width="32" height="24" rx="4" fill="#9CA3AF"/>
        <rect x="0" y="6" width="32" height="24" rx="4" fill="none" stroke="#D1D5DB" stroke-width="1"/>

        <!-- Lens -->
        <circle cx="16" cy="18" r="8" fill="#4B5563"/>
        <circle cx="16" cy="18" r="8" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
        <circle cx="16" cy="18" r="5" fill="none" stroke="#6B7280" stroke-width="1"/>

        <!-- Flash/viewfinder -->
        <rect x="24" y="8" width="4" height="3" rx="1" fill="#9CA3AF"/>
      </g>
    </g>
  </g>
</svg>
